<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ร้านอาหาร</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon" style="margin: 0 auto 16px; font-size: 2.5rem;">📝</div>
                <h1>สมัครสมาชิก</h1>
                <p>สร้างบัญชีใหม่สำหรับใช้งานระบบ</p>
            </div>
            <div class="auth-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" class="form-input" id="name" placeholder="กรอกชื่อ-นามสกุล" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">ชื่อผู้ใช้</label>
                        <input type="text" class="form-input" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">รหัสผ่าน</label>
                        <input type="password" class="form-input" id="password" placeholder="กรอกรหัสผ่าน (อย่างน้อย 6 ตัว)" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">ยืนยันรหัสผ่าน</label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
                        สมัครสมาชิก
                    </button>
                </form>
                <div id="errorMessage" class="alert alert-error" style="display: none; margin-top: 16px;">
                    <span>✗</span>
                    <span id="errorText"></span>
                </div>
                <div id="successMessage" class="alert alert-success" style="display: none; margin-top: 16px;">
                    <span>✓</span>
                    <span>สมัครสมาชิกสำเร็จ! กำลังพาไปหน้าเข้าสู่ระบบ...</span>
                </div>
            </div>
            <div class="auth-footer">
                <p>มีบัญชีแล้ว? <a href="login.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">เข้าสู่ระบบ</a></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // ตรวจสอบรหัสผ่านตรงกัน
            if (password !== confirmPassword) {
                document.getElementById('errorText').textContent = 'รหัสผ่านไม่ตรงกัน';
                document.getElementById('errorMessage').style.display = 'flex';
                return;
            }

            // สมัครสมาชิก
            const result = Auth.register(username, password, name, 'customer');

            if (result.success) {
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('successMessage').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                document.getElementById('errorText').textContent = result.message;
                document.getElementById('errorMessage').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
