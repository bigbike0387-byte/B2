<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ร้านอาหาร</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon" style="margin: 0 auto 16px; font-size: 2.5rem;">🍽️</div>
                <h1>เข้าสู่ระบบ</h1>
                <p>ระบบสั่งอาหารผ่าน QR Code</p>
            </div>
            <div class="auth-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">ชื่อผู้ใช้</label>
                        <input type="text" class="form-input" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">รหัสผ่าน</label>
                        <input type="password" class="form-input" id="password" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
                        เข้าสู่ระบบ
                    </button>
                </form>
                <div id="errorMessage" class="alert alert-error" style="display: none; margin-top: 16px;">
                    <span>✗</span>
                    <span id="errorText"></span>
                </div>
            </div>
            <div class="auth-footer">
                <p>ยังไม่มีบัญชี? <a href="register.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">สมัครสมาชิก</a></p>
                <p style="margin-top: 8px; font-size: 0.875rem; color: var(--text-gray);">
                    สำหรับทดสอบ: admin/admin123 หรือ staff/staff123
                </p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // ตรวจสอบว่าเข้าสู่ระบบแล้วหรือยัง
        const currentUser = Auth.getCurrentUser();
        if (currentUser) {
            Auth.redirectByRole();
        }

        // จัดการฟอร์มเข้าสู่ระบบ
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const result = Auth.login(username, password);

            if (result.success) {
                showToast('เข้าสู่ระบบสำเร็จ', 'success');
                setTimeout(() => {
                    Auth.redirectByRole();
                }, 500);
            } else {
                document.getElementById('errorText').textContent = result.message;
                document.getElementById('errorMessage').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
